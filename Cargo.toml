[package]
name = "nielsen-tv-enabler"
version = "0.1.2"
edition = "2024"
description = "Keeps Nielsen Accessibility Service enabled on Android TV via ADB and auto-dismisses survey prompts"
authors = ["Praveen Senpai <pvnt20@gmail.com>"]
repository = "https://github.com/Praveensenpai/nielsen-tv-enabler"
keywords = ["android-tv", "adb", "accessibility", "nielsen", "daemon"]
categories = ["command-line-utilities", "os::linux-apis"]


[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
regex = "1.10"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"

[lints.rust]
unused = "deny"
dead_code = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_arguments = "deny"
unwrap_used = "deny"
expect_used = "deny"

